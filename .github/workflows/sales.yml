name: collect-sales
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sales
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/collect_sales.mjs
      - name: commit sales table
        run: |
          git config user.name 'fliphouse-sales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/sales.json
          git diff --cached --quiet && exit 0
          git commit -m 'sales table update [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
