name: build-npc-table
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build_npc.mjs
      - name: commit npc table
        run: |
          git config user.name 'fliphouse-sales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/npc.json
          git diff --cached --quiet && exit 0
          git commit -m 'npc price table update [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
